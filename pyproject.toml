[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esoil-proceedings"
version = "0.1.0"
description = "Reproducible Pretalx ingestion and validation for the PGB proceedings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Jinja2>=3.1,<4",
    "python-dotenv>=1.1,<2",
    "PyYAML>=6.0.2,<7",
]

[project.scripts]
esoil-proceedings = "esoil_proceedings.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/esoil_proceedings"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
